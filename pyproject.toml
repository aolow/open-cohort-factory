[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-cohort-factory"
version = "0.1.0"
description = "Build reproducible disease cohorts and explicitly characterized reference populations from public biomedical data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aleksandra Olow" }]
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "mkdocs-material>=9.5,<10",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]
single-cell = [
  "cellxgene-census>=1.17,<2",
]

[project.scripts]
cohort-factory = "open_cohort_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/open_cohort_factory"]

[tool.pytest.ini_options]
addopts = "--cov=open_cohort_factory --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/open_cohort_factory/report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["open_cohort_factory"]
